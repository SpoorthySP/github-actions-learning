name: My First CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display message
        run: echo "Hello from GitHub Actions"

      - name: Check operating system
        run: uname -a

      - name: Display current directory
        run: pwd
